<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBDesign - Coutellerie Artisanale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        @font-face {
            font-family: 'Fredericka the Great';
            src: url('Typos/Fredericka_the_Great/FrederickatheGreat-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Comfortaa';
            src: url('Typos/Comfortaa/Comfortaa-VariableFont_wght.ttf') format('truetype');
            font-weight: 300 700;
            font-style: normal;
        }
        :root {
            --color-primary: #40010D;
            --color-text: #736D62;
            --color-bg: #D9CBBA;
        }
        body { font-family: 'Comfortaa', sans-serif; background-color: var(--color-bg); color: var(--color-text); }
        h1, h2, h3, h4, .logo-text { font-family: 'Fredericka the Great', cursive; font-weight: normal; }
        button:hover { opacity: 0.9; }
        input:focus, textarea:focus { border-color: var(--color-primary) !important; outline: none; }
        input, textarea { background-color: var(--color-bg) !important; border-color: var(--color-primary) !important; color: var(--color-text) !important; opacity: 0.9; }
        .hero-image { position: relative; background-image: url('assets/composite_acceuil_logo1920x1080.png'); background-size: cover; background-position: center; min-height: 100vh; }
        .hero-image::before { content: ''; position: absolute; inset: 0; background-color: rgba(255,255,255,0.5); pointer-events: none; }
        .product-card:hover .view-details-btn { opacity: 1; }
        .modal { transition: opacity 0.3s ease; }
        .modal-content { max-height: 95vh; overflow-y: auto; width: 95vw; max-width: 1200px; min-width: 320px; }
        .image-zoom-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
        .image-zoom-content { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .image-clickable { cursor: zoom-in; transition: transform 0.2s ease; }
        .image-clickable:hover { transform: scale(1.02); }
        .zoom-close-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color 0.3s ease; }
        .zoom-close-btn:hover { background: rgba(255,255,255,0.3); }
        #modal-description { white-space: pre-line; line-height: 1.6; }
        .carbon-warning { background-color: #fef2f2; border: 1px solid #dc2626; padding: 12px; margin-top: 16px; font-size: 0.75rem; line-height: 1.4; }
        .warning-title { color: #dc2626; font-weight: bold; margin-bottom: 8px; }
        .workshop-image { position: relative; transition: transform 0.5s ease; transform-origin: center center; will-change: transform; background: var(--color-bg); }
        .workshop-image:hover { transform: scale(2); z-index: 60; box-shadow: 0 12px 28px -6px rgba(0,0,0,0.45); cursor: zoom-in; }
        .workshop-image img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        section h2.active { transform: translateY(10px); }
        .hirazukuri-popup .thumbnail-container { grid-template-columns: repeat(3, 1fr); }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navigation (inchangée) -->
    <nav style="background-color: rgba(64, 1, 13, 0.95)" class="py-4 px-6 border-b border-opacity-20 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: var(--color-bg)">
                    <span class="text-xl logo-text">PB</span>
                </div>
                <span class="text-xl logo-text">PBDesign</span>
            </div>
            <div class="hidden md:flex space-x-8">
                <a href="#home" class="transition hover:opacity-80" style="color: var(--color-text);">Accueil</a>
                <a href="#galerie" class="transition hover:opacity-80" style="color: var(--color-text);">Galerie</a>
                <a href="#atelier" class="transition hover:opacity-80" style="color: var(--color-text);">Atelier</a>
                <a href="#paiement" class="transition hover:opacity-80" style="color: var(--color-text);">Paiement</a>
                <a href="#about" class="transition hover:opacity-80" style="color: var(--color-text);">À propos</a>
                <a href="#contact" class="transition hover:opacity-80" style="color: var(--color-text);">Contact</a>
            </div>
            <div class="flex items-center space-x-4">
                <button class="md:hidden" id="mobile-menu-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden absolute w-full left-0 px-6 py-2 border-t" style="background-color: var(--color-primary); border-color: var(--color-dark);">
            <div class="flex flex-col space-y-3">
                <a href="#home" class="hover:text-red-700 transition py-1">Accueil</a>
                <a href="#galerie" class="hover:text-red-700 transition py-1">Galerie</a>
                <a href="#atelier" class="hover:text-red-700 transition py-1">Atelier</a>
                <a href="#paiement" class="hover:text-red-700 transition py-1">Paiement</a>
                <a href="#about" class="hover:text-red-700 transition py-1">À propos</a>
                <a href="#contact" class="hover:text-red-700 transition py-1">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section (inchangée) -->
    <section id="home" class="hero-image h-screen flex items-center justify-center">
        <div class="text-center px-4 relative z-10">
            <h1 class="text-6xl md:text-9xl font-light mb-6" style="color: var(--color-primary);">PBDesign</h1>
            <p class="text-2xl md:text-3xl mb-10 max-w-3xl mx-auto font-medium" style="color: var(--color-primary);">Coutellerie artisanale d'inspiration scandinave et japonaise</p>
        </div>
    </section>

    <!-- Boutique Section (avec Hirazukuri intégrée) -->
    <section id="galerie" class="py-16 px-6" style="background-color: var(--color-bg);">
        <div class="container mx-auto">
            <h2 class="text-3xl font-light mb-12 text-center" style="color: var(--color-text);">Galerie</h2>
            <div class="flex flex-wrap justify-center gap-4 mb-12">
                <button class="category-btn px-6 py-2 transition hover:opacity-90" style="background-color: var(--color-primary); color: #D9CBBA;" data-category="all">Tous</button>
                <button class="category-btn px-6 py-2 transition hover:opacity-90" style="background-color: var(--color-primary); color: #D9CBBA;" data-category="puukko">Puukko</button>
                <button class="category-btn px-6 py-2 transition hover:opacity-90" style="background-color: var(--color-primary); color: #D9CBBA;" data-category="pliant">Pliants</button>
                <button id="cuisine-main-btn" class="category-btn px-6 py-2 transition hover:opacity-90" style="background-color: var(--color-primary); color: #D9CBBA;" data-category="cuisine">Cuisine</button>
                <button class="category-btn px-6 py-2 transition hover:opacity-90" style="background-color: var(--color-primary); color: #D9CBBA;" data-category="accessoire">Accessoires</button>
            </div>
            <div id="cuisine-subcategories" class="hidden flex justify-center gap-2 mb-4">
                <button class="subcategory-btn px-4 py-2 transition hover:opacity-90" style="background-color: var(--color-primary); color: #D9CBBA;" data-subcategory="cuisine-damas">Gamme Suminagashi</button>
                <button class="subcategory-btn px-4 py-2 transition hover:opacity-90" style="background-color: var(--color-primary); color: #D9CBBA;" data-subcategory="cuisine-carbone">Gamme Tsuchime</button>
                <button class="subcategory-btn px-4 py-2 transition hover:opacity-90" style="background-color: var(--color-primary); color: #D9CBBA;" data-subcategory="cuisine-hira">Gamme Hirazukuri</button>
            </div>
            <div id="subcategory-info" class="max-w-2xl mx-auto mb-8 text-center text-base" style="color: var(--color-text); display:none;"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Tes produits existants (Suminagashi, Tsuchime, Puukko, etc. - inchangés) -->
                <!-- (Je les ai tous copiés tels quels de ton code d'hier, pas une ligne modifiée) -->
                <!-- Exemple pour Honesuki Suminagashi -->
                <div class="product-card rounded overflow-hidden relative shadow-[-8px_8px_16px_-2px_rgba(0,0,0,0.5)] hover:shadow
